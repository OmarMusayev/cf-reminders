name: CF Data + Outbox

on:
  schedule:
    - cron: '13 */2 * * *'    # backup schedule: every 2h at :13 (off-peak to reduce GH cron lag)
  workflow_dispatch:
  repository_dispatch:
    types: [send-outbox]      # routine fires this immediately after creating drafts

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Codeforces data
        run: python fetch_data.py

      - name: Commit data changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Send queued [CF] drafts
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python send_outbox.py
